# ==============================================================================
# Development Profile Configuration
# ==============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fieldservice}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Strict schema validation (Flyway manages all schema migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development JWT Secret (overridable via APP_JWT_SECRET environment variable)
app.jwt.secret=${APP_JWT_SECRET:dev_jwt_secret_key_that_is_at_least_32_bytes_long_for_hmac_sha256}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Demo Seed Data Configuration
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.default-password=${APP_SEED_PASSWORD:password123}
