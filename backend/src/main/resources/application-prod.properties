# ==============================================================================
# Production Profile Configuration
# ==============================================================================

# In production, datasource details MUST be supplied via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Strict schema validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# In production, APP_JWT_SECRET is strictly validated by JwtUtils on startup
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Hibernate batch fetching & performance
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Demo seed data disabled in prod
app.seed.enabled=false

# SLA Alert Scheduler
app.scheduling.enabled=true
app.sla.alert.fixed-rate-ms=60000
app.sla.alert.initial-delay-ms=10000

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=fieldservice
