spring.application.name=fieldservice-test

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fieldservice_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nitesh@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Strict schema validation in tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway runs migrations in integration tests
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:9a3f2c4e6b8a1d5e7f0b2d4c6e8a1f3b5c7d9e1a3b5c7d9e1a3b5c7d9e1a3b5c}
app.jwt.expiration-ms=86400000

# Demo Seed Data disabled in test profile
app.seed.enabled=false
app.seed.default-password=password123

# Disable background scheduler in test profile by default
app.scheduling.enabled=false
